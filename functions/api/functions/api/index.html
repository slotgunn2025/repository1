<!-- Load PayPal SDK -->
<script src="https://www.paypal.com/sdk/js?client-id=BAACnaEoFm2BkPMlpPp1XrGs5skvZXZ5RM59K1UftW9Dswftv3T4kPCclvbbr38lIdTDc1sDAN6zDikGWk&currency=CAD"></script>

<!-- Payment Button Container -->
<div id="paypal-button-container"></div>

<!-- Payment Script -->
<script>
  paypal.Buttons({
    async createOrder() {
      const response = await fetch('/api/create-order', { method: 'POST' });
      const order = await response.json();
      return order.id;
    },
    async onApprove(data) {
      const response = await fetch(`/api/capture-order?orderId=${data.orderID}`, { method: 'POST' });
      const details = await response.json();
      alert('Payment completed successfully!');
    }
  }).render('#paypal-button-container');
</script>
